services:
  api:
    build:
      # Self-contained: context is this dir (Dockerfile vendors triage/).
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Secrets come from the Coolify environment UI (never baked into the image).
    environment:
      - DB_URL=sqlite:////srv/data/tickets.db
      - PORT=8000
    volumes:
      # Persist SQLite across restarts/rebuilds (separate from app code).
      - tickets-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tickets-data:
