[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "LLM intake harness and rules-based triage engine for the voice-first medical intake agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]
voice = ["faster-whisper>=1.1", "sounddevice", "numpy", "pyttsx3"]
translate = ["transformers", "torch", "sentencepiece"]  # triage.translation.NLLBTranslator
train = ["numpy>=1.26", "scikit-learn>=1.4"]  # training/followup/train.py only

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"triage.followup" = ["model.json"]
